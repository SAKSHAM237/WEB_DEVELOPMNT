<!DOCTYPE html>
<html>
<head>
    <title>Navigation Assignment</title>
    <style>
        .container {
            border: 2px solid black;
            padding: 10px;
            font-family: "Times New Roman", Times, serif;
        }

        .header {
            background-color: #d3d3d3; 
            text-align: center;
            padding: 15px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .red-text {
            color: red;
        }

        .nav-row a {
            display: inline-block;
            text-decoration: none; 
            color: black; 
            padding: 5px 10px;
            margin-right: 5px; 
            margin-bottom: 5px;
        }

        .blue-links a {
            background-color: lightblue;
        }

        .green-links a {
            background-color: lightgreen;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            My <span class="red-text">Website</span> Navigation
        </div>

        <div class="nav-row blue-links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>

        <div class="nav-row green-links">
            <a href="#">Dashboard</a>
            <a href="#">Profile</a>
            <a href="#">Messages</a>
            <a href="#">Logout</a>
        </div>
    </div>

</body>
</html>
