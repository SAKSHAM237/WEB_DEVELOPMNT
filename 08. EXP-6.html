<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #ffffff;
        }
        .label {
            font-size: 18px;
            margin-bottom: 15px;
            color: #000;
        }
        .container {
            border: 1px solid #000;
            max-width: 800px;
            background-color: #f9fbfd;
            padding-bottom: 50px;
        }
        .header {
            background-color: #232323;
            color: white;
            text-align: center;
            padding: 15px 0;
            font-size: 22px;
            margin-bottom: 40px;
        }
        .card {
            background-color: white;
            width: 250px;
            margin: 0 auto;
            padding: 10px;
            border: 1px solid #e5e5e5;
            border-radius: 3px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .image-box {
            width: 100%;
            height: 160px;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
        }
        .image-box img {
            max-height: 100%;
            object-fit: contain;
        }
        h3 {
            font-size: 14px;
            margin: 5px 0;
            color: #000;
            font-weight: 700;
        }
        .desc {
            font-size: 11px;
            color: #666;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        .price-row {
            margin-bottom: 10px;
            font-size: 14px;
        }
        .price {
            color: #1e7e34;
            font-weight: bold;
            margin-right: 5px;
        }
        .old-price {
            color: #999;
            text-decoration: line-through;
            font-size: 12px;
        }
        button {
            background-color: #0062cc;
            color: white;
            border: none;
            width: 100%;
            padding: 8px 0;
            font-size: 13px;
            border-radius: 3px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="label">Output:</div>

    <div class="container">
        <div class="header">ShopEasy</div>
        
        <div class="card">
            <div class="image-box">
                <img src="https://i.ibb.co/tpjH6v0z/Screenshot-2025-11-10-093151.png">
                </div>
            
            <h3>Classic Cotton T-Shirt</h3>
            <div class="desc">Soft, breathable cotton. Regular fit. Available in multiple colors.</div>
            
            <div class="price-row">
                <span class="price">₹799</span>
                <span class="old-price">₹1,199</span>
            </div>
            
            <button>Add to Cart</button>
        </div>
    </div>

</body>
</html>
