<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter Subscription</title>
    <style>
        
        
        
        
        .container {
            background: rgb(67, 71, 129);
            padding: 50px;
            width: 100%;
            
            text-align: center;
        }
        
        h1 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 15px;
            font-size: 32px;
        }
        
        p {
            text-align: center;
            color: #ddd5d5;
            margin-bottom: 35px;
            font-size: 14px;
        }
        
        
        
        label {
            color: #ffffff;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 13px;
        }
        
        input {
            padding: 14px;
            margin-bottom: 25px;
            border-radius: 5px;
            font-size: 14px;
        }
        
        
        
        button {
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 16px;
            font-weight: bold;
        }
        
        
    </style>
</head>
<body>

<span id="body">

    <div class="container">
        <h1>NEWSLETTER</h1>
        <p>Subscribe to our newsletter for the latest news and updates</p>
        <form>
            <label>Email Address</label>
            <input required type="email" placeholder="your@email.com">
            <button type="submit">Subscribe</button>
        </form>
    </div>

    </span>
</body>
